<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물 인형뽑기 학급 추첨기 🧸🐾</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }
        body {
            background-color: #F0F9FF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .main-wrapper {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        /* 입력창 영역 */
        .input-card {
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
            border: 4px solid #7DD3FC;
            flex: 1;
            min-width: 280px;
            max-width: 320px;
            display: flex;
            flex-direction: column;
        }
        .input-card h2 {
            color: #0284C7;
            font-size: 20px;
            margin-top: 0;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 2px solid #BAE6FD;
            border-radius: 15px;
            resize: none;
            font-size: 14px;
            outline: none;
            background-color: #F0F9FF;
        }
        .info {
            font-size: 12px;
            color: #64748B;
            margin-top: 8px;
            margin-bottom: 15px;
        }
        .setup-btn {
            background-color: #0284C7;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0369A1;
            transition: all 0.1s;
        }
        .setup-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0369A1;
        }

        /* 인형뽑기 기계 영역 */
        .machine-container {
            background: #38BDF8;
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 6px solid #0284C7;
            width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .machine-title {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px #0369A1;
        }
        /* 유리 상자 */
        .glass-box {
            background: linear-gradient(135deg, #E0F2FE 0%, #FFFFFF 100%);
            width: 100%;
            height: 380px;
            border-radius: 20px;
            border: 5px solid #BAE6FD;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }
        /* 집게 조작부 */
        .claw-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: #94A3B8;
        }
        .claw-rope {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 4px;
            height: 30px;
            background: #475569;
            transform: translateX(-50%);
            transition: height 1.2s ease-in-out, left 1s ease-in-out;
            z-index: 5;
        }
        .claw-head {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            line-height: 1;
        }

        /* 기계 내부 인형들 바닥 구역 */
        .dolls-area {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 180px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-end;
            justify-content: center;
            gap: 8px;
        }
        /* 개별 동물 인형 */
        .doll {
            background: white;
            border: 2px solid #7DD3FC;
            border-radius: 18px;
            padding: 5px 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 13px;
            font-weight: bold;
            color: #334155;
            transition: all 0.3s;
        }
        .doll-icon {
            font-size: 20px;
        }

        /* 출구 구멍 */
        .exit-chute {
            position: absolute;
            bottom: 0;
            right: 15px;
            width: 70px;
            height: 50px;
            background: #334155;
            border-radius: 10px 10px 0 0;
            border: 3px solid #1E293B;
        }

        /* 하단 조작 버튼 */
        .play-btn {
            margin-top: 15px;
            width: 100%;
            background: #F59E0B;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #D97706;
            transition: all 0.1s;
        }
        .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #D97706;
        }
        .play-btn:disabled {
            background: #CBD5E1;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 당첨 축하 팝업 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 30px;
            border: 6px solid #38BDF8;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 320px;
            width: 90%;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .winner-icon {
            font-size: 70px;
            margin-bottom: 10px;
        }
        .winner-title {
            font-size: 16px;
            color: #0284C7;
            font-weight: bold;
        }
        .winner-name {
            font-size: 32px;
            color: #0369A1;
            font-weight: bold;
            margin: 10px 0;
        }
        .close-btn {
            background: #38BDF8;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- 왼쪽: 학생 명단 입력 구역 -->
    <div class="input-card">
        <h2>📝 학생 명단 입력</h2>
        <textarea id="nameInput" placeholder="학생 이름을 입력하세요&#10;(줄바꿈으로 구분)&#10;&#10;예시:&#10;김철수&#10;이영희&#10;박민수"></textarea>
        <div class="info">💡 이름을 입력한 후 아래 [인형 넣기] 버튼을 눌러주세요!</div>
        <button class="setup-btn" onclick="loadDolls()">🧸 동물 인형 넣기</button>
    </div>

    <!-- 오른쪽: 동물 인형뽑기 기계 -->
    <div class="machine-container">
        <div class="machine-title">🐾 동물 인형뽑기 🐾</div>
        
        <div class="glass-box">
            <div class="claw-track"></div>
            <!-- 집게와 줄 -->
            <div class="claw-rope" id="clawRope">
                <div class="claw-head" id="clawHead">🏗️</div>
            </div>

            <!-- 바닥 인형들 구역 -->
            <div class="dolls-area" id="dollsArea">
                <!-- 동물 인형들이 여기에 생성됩니다 -->
            </div>

            <div class="exit-chute"></div>
        </div>

        <button class="play-btn" id="startBtn" onclick="startClawGame()">🎮 인형 뽑기 START!</button>
    </div>
</div>

<!-- 당첨자 발표 모달 팝업 -->
<div class="modal" id="resultModal">
    <div class="modal-content">
        <div class="winner-icon" id="modalIcon">🐶</div>
        <div class="winner-title" id="modalAnimalName">귀여운 강아지가 선택한!</div>
        <div class="winner-name" id="modalStudentName">김철수</div>
        <button class="close-btn" onclick="closeModal()">확인 완료 ✨</button>
    </div>
</div>

<script>
    // 동물 캐릭터 데이터 (아이콘 & 색상)
    const animalDolls = [
        { name: '강아지 인형', icon: '🐶', color: '#FEF08A' },
        { name: '고양이 인형', icon: '🐱', color: '#FED7AA' },
        { name: '곰돌이 인형', icon: '🐻', color: '#FFEDD5' },
        { name: '토끼 인형', icon: '🐰', color: '#FCE7F3' },
        { name: '판다 인형', icon: '🐼', color: '#E2E8F0' },
        { name: '여우 인형', icon: '🦊', color: '#FFEDD5' },
        { name: '개구리 인형', icon: '🐸', color: '#DCFCE7' },
        { name: '병아리 인형', icon: '🐥', color: '#FEF9C3' },
        { name: '호랑이 인형', icon: '🐯', color: '#FFEDD5' },
        { name: '펭귄 인형', icon: '🐧', color: '#E0F2FE' }
    ];

    let currentStudentList = [];

    // 인형 생성 및 배치 함수
    function loadDolls() {
        const input = document.getElementById('nameInput').value;
        currentStudentList = input.split('\n').map(name => name.trim()).filter(name => name.length > 0);

        const dollsArea = document.getElementById('dollsArea');
        dollsArea.innerHTML = '';

        if (currentStudentList.length === 0) {
            alert('학생 이름을 먼저 입력해 주세요!');
            return;
        }

        // 입력된 학생 수만큼 동물 인형 생성
        currentStudentList.forEach((student, index) => {
            const animal = animalDolls[index % animalDolls.length];
            const dollDiv = document.createElement('div');
            dollDiv.className = 'doll';
            dollDiv.id = `doll-${index}`;
            dollDiv.style.backgroundColor = animal.color;
            dollDiv.innerHTML = `<span class="doll-icon">${animal.icon}</span> <span>${student}</span>`;
            dollsArea.appendChild(dollDiv);
        });
    }

    // 인형뽑기 애니메이션 실행 함수
    function startClawGame() {
        if (currentStudentList.length === 0) {
            alert('먼저 명단을 입력하고 [인형 넣기]를 눌러주세요!');
            return;
        }

        const startBtn = document.getElementById('startBtn');
        const clawRope = document.getElementById('clawRope');
        const clawHead = document.getElementById('clawHead');
        
        startBtn.disabled = true; // 중복 클릭 방지

        // 1. 당첨자 및 무작위 위치 선정
        const targetIndex = Math.floor(Math.random() * currentStudentList.length);
        const selectedStudent = currentStudentList[targetIndex];
        const selectedAnimal = animalDolls[targetIndex % animalDolls.length];

        // 집게 이동 계산 (좌우)
        const randomLeft = Math.floor(Math.random() * 60) + 20; // 20% ~ 80% 사이 위치
        clawRope.style.left = `${randomLeft}%`;

        // Step 1: 좌우 이동 후 내려가기
        setTimeout(() => {
            clawRope.style.height = '260px'; // 바닥으로 내려감
            clawHead.innerText = '👐'; // 집게 펼침
        }, 1000);

        // Step 2: 인형 집기
        setTimeout(() => {
            clawHead.innerText = '✊'; // 집게 쥐기
            
            // 시각적으로 선택된 인형 숨기기
            const targetDoll = document.getElementById(`doll-${targetIndex}`);
            if(targetDoll) targetDoll.style.opacity = '0.3';
        }, 2200);

        // Step 3: 위로 올리기
        setTimeout(() => {
            clawRope.style.height = '30px'; // 다시 위로 상승
        }, 2800);

        // Step 4: 출구(우측)로 이동 후 떨어뜨리기 & 결과 창 등장
        setTimeout(() => {
            clawRope.style.left = '82%'; // 출구 위치로 이동
        }, 4000);

        setTimeout(() => {
            clawHead.innerText = '👐'; // 인형 떨어뜨림
            showWinner(selectedStudent, selectedAnimal);
            startBtn.disabled = false;
        }, 5000);
    }

    // 결과 팝업 창
    function showWinner(studentName, animal) {
        document.getElementById('modalIcon').innerText = animal.icon;
        document.getElementById('modalAnimalName').innerText = `귀여운 [${animal.name}]을 뽑았어요!`;
        document.getElementById('modalStudentName').innerText = studentName;
        document.getElementById('resultModal').style.display = 'flex';
    }

    // 모달 닫기
    function closeModal() {
        document.getElementById('resultModal').style.display = 'none';
        
        // 집게 제자리 원위치
        const clawRope = document.getElementById('clawRope');
        const clawHead = document.getElementById('clawHead');
        clawRope.style.left = '50%';
        clawHead.innerText = '🏗️';
    }

    // 초기 실행시 샘플 인형 로드
    document.getElementById('nameInput').value = "김철수\n이영희\n박민수\n정지원\n최동현";
    loadDolls();
</script>

</body>
</html>
